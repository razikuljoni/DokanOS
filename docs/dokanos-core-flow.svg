<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" aria-label="DokanOS Core Flow: POS Sale to Atomic Stock Decrement, Dashboard Update, and Low-Stock Alert" role="img" viewBox="0 0 960 440"><defs><style>@keyframes stepOne{0%,30%{opacity:1}35%,95%{opacity:.55}}@keyframes stepTwo{0%,30%,70%{opacity:.45}35%,65%{opacity:1}}@keyframes stepThree{0%,65%{opacity:.35}70%,95%{opacity:1}}.paper{fill:#faf7f2}.card{fill:#fff;stroke:#e7e0d4;stroke-width:1.5}.header,.ink{fill:#1c1917}.ink{font-family:&apos;Space Grotesk&apos;,system-ui,sans-serif}.body{fill:#57534e;font-family:&apos;Inter&apos;,system-ui,sans-serif}.mono{fill:#1c1917;font-family:&apos;JetBrains Mono&apos;,monospace;font-variant-numeric:tabular-nums}.green,.green-bg{fill:#14532d}.amber{fill:#b45309}.amber-box{fill:#fef3c7;stroke:#f59e0b;stroke-width:1}.pulse-1{animation:stepOne 6s infinite}.pulse-2{animation:stepTwo 6s infinite}.pulse-3{animation:stepThree 6s infinite}</style></defs><rect width="960" height="440" stroke="#E7E0D4" stroke-width="2" class="paper" rx="8"/><rect width="960" height="48" x="0" y="0" class="header" rx="8"/><text x="24" y="30" fill="#FAF7F2" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="700">DokanOS · Rahim Pharmacy (Mirpur-10)</text><text x="730" y="29" fill="#A8A29E" font-family="JetBrains Mono, monospace" font-size="12">PRO PLAN · BDT (৳) · Asia/Dhaka</text><g class="pulse-1"><rect width="288" height="344" x="24" y="70" class="card" rx="6"/><text x="42" y="100" class="ink" font-size="15" font-weight="700">1. POS Counter Checkout</text><text x="42" y="120" class="body" font-size="11">Atomic Mongoose Replica-Set Transaction</text><rect width="252" height="54" x="42" y="138" fill="#F3EFE6" rx="4"/><text x="54" y="159" class="ink" font-size="12" font-weight="600">Napa Extra 500mg (Box)</text><text x="54" y="177" class="mono" font-size="11">৳120 × 2 box · Stock: 6 → 4</text><text x="234" y="168" class="mono" font-size="13" font-weight="700">৳240</text><rect width="252" height="54" x="42" y="202" fill="#F3EFE6" rx="4"/><text x="54" y="223" class="ink" font-size="12" font-weight="600">Sergel 20mg Capsule (Strip)</text><text x="54" y="241" class="mono" font-size="11">৳70 × 3 strip · Stock: 42 → 39</text><text x="234" y="232" class="mono" font-size="13" font-weight="700">৳210</text><line x1="42" x2="294" y1="274" y2="274" stroke="#E7E0D4"/><text x="42" y="298" class="body" font-size="12">Grand Total (INV-0024)</text><text x="220" y="300" class="mono green" font-size="20" font-weight="700">৳450</text><text x="42" y="322" class="mono" font-size="11">Paid: ৳300 (CASH) · Baki Due: ৳150</text><rect width="252" height="40" x="42" y="352" class="green-bg" rx="5"/><text x="86" y="377" fill="#FFF" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600">Settle &amp; Print Receipt</text></g><g class="pulse-2"><rect width="288" height="344" x="336" y="70" class="card" rx="6"/><text x="354" y="100" class="ink" font-size="15" font-weight="700">2. Live Ledger Aggregation</text><text x="354" y="120" class="body" font-size="11">Redis Cache Invalidated · Socket.io Push</text><rect width="120" height="72" x="354" y="138" fill="#F3EFE6" rx="4"/><text x="366" y="158" class="body" font-size="11">30d Revenue</text><text x="366" y="188" class="mono" font-size="18" font-weight="700">৳68,870</text><rect width="120" height="72" x="486" y="138" fill="#F3EFE6" rx="4"/><text x="498" y="158" class="body" font-size="11">Net COGS Profit</text><text x="498" y="188" class="mono green" font-size="18" font-weight="700">৳15,010</text><rect width="252" height="76" x="354" y="224" fill="#F3EFE6" rx="4"/><text x="366" y="246" class="ink" font-size="12" font-weight="600">Customer Baki Receivable</text><text x="366" y="266" class="mono amber" font-size="16" font-weight="700">৳4,350 (+৳150 Baki)</text><text x="366" y="286" class="body" font-size="11">Ageing Bucket: 0–7 Days · Walk-in Customer</text><rect width="252" height="76" x="354" y="316" fill="#F3EFE6" rx="4"/><text x="366" y="338" class="ink" font-size="12" font-weight="600">PWA Offline Outbox Ready</text><text x="366" y="358" class="mono" font-size="11">IndexedDB + X-Idempotency-Key</text><text x="366" y="376" class="body" font-size="11">Zero duplicate stock/due mutations</text></g><g class="pulse-3"><rect width="288" height="344" x="648" y="70" class="card" rx="6"/><text x="666" y="100" class="ink" font-size="15" font-weight="700">3. Real-Time Low-Stock Alert</text><text x="666" y="120" class="body" font-size="11">Socket.io stock:low + BullMQ Daily Digest</text><rect width="252" height="84" x="666" y="138" class="amber-box" rx="4"/><text x="680" y="162" class="ink" font-size="12" font-weight="700">LOW STOCK THRESHOLD HIT</text><text x="680" y="182" class="mono amber" font-size="12" font-weight="600">Napa Extra 500mg: 4 box left</text><text x="680" y="202" class="body" font-size="11">Threshold: 10 box · Reorder from Square Pharma</text><rect width="252" height="154" x="666" y="238" fill="#F3EFE6" rx="4"/><text x="680" y="262" class="ink" font-size="12" font-weight="700">SSLCommerz Sandbox Verified</text><text x="680" y="284" class="mono" font-size="11">Plan: DokanOS Pro (৳499 / 30d)</text><text x="680" y="304" class="mono" font-size="11">GET / POST Callback + IPN Guard</text><text x="680" y="324" class="mono green" font-size="11">Status: VALIDATED (Idempotent)</text><text x="680" y="348" class="body" font-size="11">100% Tenant-Scoped · RBAC Enforced</text><text x="680" y="368" class="mono" font-size="11">Vitest: 13/13 Passed · TypeScript Strict</text></g></svg>